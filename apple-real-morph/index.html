<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Apple-like Menu Morph (WORKING)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  body {
    margin: 0;
    height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at top, #4a4a4a, #151515);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }

  /* glass кнопка */
  .menu-btn {
    width: 56px;
    height: 56px;
    border-radius: 18px;
    display: grid;
    place-items: center;
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04),
      0 10px 28px rgba(0,0,0,0.35);
    cursor: pointer;
  }

  svg {
    width: 26px;
    height: 26px;
  }

  line {
    stroke: rgba(255,255,255,0.85);
    stroke-width: 2;
    stroke-linecap: round;
  }
</style>
</head>
<body>

<button class="menu-btn" aria-label="Menu">
  <svg viewBox="0 0 24 24">
    <line id="l1" x1="5" y1="9"  x2="19" y2="9"/>
    <line id="l2" x1="5" y1="15" x2="19" y2="15"/>
  </svg>
</button>

<script>
  const btn = document.querySelector('.menu-btn');
  const l1 = document.getElementById('l1');
  const l2 = document.getElementById('l2');

  let open = false;

  function animateLine(line, from, to, duration = 280) {
    const start = performance.now();

    function frame(now) {
      const t = Math.min((now - start) / duration, 1);
      const ease = t * (2 - t); // easeOut

      ['x1','y1','x2','y2'].forEach(k => {
        line.setAttribute(
          k,
          from[k] + (to[k] - from[k]) * ease
        );
      });

      if (t < 1) requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  }

  btn.addEventListener('click', () => {
    if (!open) {
      animateLine(l1,
        {x1:5,y1:9,x2:19,y2:9},
        {x1:6,y1:6,x2:18,y2:18}
      );
      animateLine(l2,
        {x1:5,y1:15,x2:19,y2:15},
        {x1:18,y1:6,x2:6,y2:18}
      );
    } else {
      animateLine(l1,
        {x1:6,y1:6,x2:18,y2:18},
        {x1:5,y1:9,x2:19,y2:9}
      );
      animateLine(l2,
        {x1:18,y1:6,x2:6,y2:18},
        {x1:5,y1:15,x2:19,y2:15}
      );
    }
    open = !open;
  });
</script>

</body>
</html>
